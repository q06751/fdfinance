services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "5050:5050"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__FinanceDb: "Data Source=/data/fdfinance.db"
      ConnectionStrings__Redis: "redis:6379"
      Redis__Enabled: "true"
      Urls: "http://0.0.0.0:5050"
    volumes:
      - finance_data:/data
    depends_on:
      - redis

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      API_URL: "http://api:5050"
    depends_on:
      - api

volumes:
  redis_data:
  finance_data:
